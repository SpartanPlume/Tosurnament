name: tosurnament-test
services:
  db:
    build:
      context: ../..
      dockerfile: docker/test/test-db.Dockerfile
    environment:
      - POSTGRES_USER=postgres
      - PGUSER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tosurnament
    command: [ "-c", "ssl=on", "-c", "ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem", "-c", "ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - ${DB_PORT}:5432
  irc:
    build:
      context: ../..
      dockerfile: docker/test/test-irc.Dockerfile
    ports:
      - ${IRC_PORT}:6667
  test:
    build:
      context: ../..
      dockerfile: docker/test/test.Dockerfile
    command: ["cargo", "test", "--", "--include-ignored"]
    depends_on:
        db:
          condition: service_healthy
        irc:
          condition: service_started
    environment:
      - APP_DATABASE__USERNAME=${DB_USERNAME}
      - APP_DATABASE__PASSWORD=${DB_PASSWORD}
      - APP_DATABASE__DATABASE_NAME=${DB_NAME}
      - APP_DATABASE__HOST=db
      - APP_REFCHAT__HOST=irc
      - DATABASE_URL=postgres://${DB_USERNAME}:${DB_PASSWORD}@localhost:${DB_PORT}/${DB_NAME}
      - TEST_LOG=0
