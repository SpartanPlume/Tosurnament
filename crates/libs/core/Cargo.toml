[package]
name = "tosurnament-core"
version = "0.1.0"
authors = ["Spartan Plume <spartan.plume@gmail.com>"]
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
test-utils = []

[dependencies]
anyhow = "1.0.*"
chrono = { version = "0.4.*", default-features = false, features = [
    "clock",
    "serde",
] }
lazy_static = "1.5.*"
nutype = { version = "0.6.*", features = ["regex", "serde"] }
nutype_macros = { version = "0.6.*", features = ["regex"] }
ormlite = { version = "0.23.*", features = ["postgres", "chrono"] }
regex = "1.11.*"
secrecy = { version = "0.10.*", features = ["serde"] }
serde = { version = "1.0.*", features = ["derive"] }
serde-aux = "4.6.*"
serde_json = "1.0.*"
sqlx = { version = "0.8.*", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "chrono",
    "tls-rustls",
] }
tracing = { version = "0.1.*", features = ["log"] }
tokio = { version = "1.44.*", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.*"

[dev-dependencies]
claims = "0.8.*"
proptest = "1.6.*"
tosurnament-config = { path = "../config" }
tosurnament-core = { path = ".", features = ["test-utils"] }
