[package]
name = "tosurnament-core"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.*"
chrono = {
  version = "0.4.*",
  default-features = false,
  features = [
    "clock",
    "serde",
  ]
}
nutype = { version = "0.7.*", features = ["regex", "serde"] }
nutype_macros = { version = "0.7.*", features = ["regex"] }
ormlite = { version = "0.24.*", features = ["chrono", "postgres"] }
regex = "1.12.*"
secrecy = { version = "0.10.*", features = ["serde"] }
serde = { version = "1.0.*", features = ["derive"] }
serde-aux = "4.7.*"
serde_json = "1.0.*"
sqlx = {
  version = "0.8.*",
  features = [
    "chrono",
    "macros",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
  ]
}
tokio = { version = "1.44.*", features = ["macros", "rt-multi-thread", "time"] }
tracing = { version = "0.1.*", features = ["log"] }
url = "2.5.*"

[dev-dependencies]
claims = "0.8.*"
proptest = "1.11.*"
tosurnament-config = { path = "../config" }

[features]
test-utils = []
