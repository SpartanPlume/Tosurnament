[package]
name = "tosurnament-core"
version = "0.1.0"
authors = ["Spartan Plume <spartan.plume@gmail.com>"]
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
test-utils = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
] }
lazy_static = "1.4"
nutype = { version = "0.4", features = ["regex", "serde"] }
nutype_macros = { version = "0.4", features = ["regex"] }
ormlite = { version = "0.19", features = ["postgres", "chrono"] }
regex = "1.10"
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-aux = "4"
serde_json = "1.0"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "chrono",
    "tls-rustls",
] }
tracing = { version = "0.1", features = ["log"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
claims = "0.7"
proptest = "1.4"
tosurnament-core = { path = ".", features = ["test-utils"] }
