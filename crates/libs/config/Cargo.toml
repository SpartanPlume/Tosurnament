[package]
name = "tosurnament-config"
version = "0.1.0"
authors = ["Spartan Plume <spartan.plume@gmail.com>"]
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
figment = { version = "0.10.*", features = ["env", "yaml"] }
figment_file_provider_adapter = "0.1.*"
serde = { version = "1.0.*", features = ["derive"] }
thiserror = "2.0.*"

[dev-dependencies]
serial_test = "3.2.*"
tosurnament-tmpenv = { path = "../tmpenv" }
