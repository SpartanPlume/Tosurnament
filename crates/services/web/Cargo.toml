[package]
name = "tosurnament-web"
version = "0.1.0"
authors = ["Spartan Plume <spartan.plume@gmail.com>"]
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "tosurnament-web"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
] }
once_cell = "1.19"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde-aux = "4"
tera = "1"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = { version = "0.1", features = ["log"] }
tosurnament-core = { path = "../../libs/core" }
tosurnament-config = { path = "../../libs/config" }
tosurnament-telemetry = { path = "../../libs/telemetry" }

[dev-dependencies]
once_cell = "1"
tl = "0.7"
tosurnament-api = { path = "../api", default-features = false, features = [
    "test-utils",
] }
