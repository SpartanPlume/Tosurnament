[package]
name = "tosurnament-web"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tosurnament-web"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.*"
axum = { version = "0.8.*", features = ["macros", "ws"] }
chrono = {
  version = "0.4.*",
  default-features = false,
  features = [
    "clock",
    "serde",
  ]
}
educe = {
  version = "0.6.*",
  default-features = false,
  features = [
    "Eq",
    "PartialEq",
  ]
}
futures = "0.3.*"
indexmap = "2.9.*"
irc = {
  version = "1.1.*",
  default-features = false,
  features = [
    "channel-lists",
    "ctcp",
    "tls-native",
  ]
}
once_cell = "1.21.*"
regex = "1.12.*"
reqwest = { version = "0.13.*", features = ["form", "json"] }
secrecy = "0.10.*"
serde = { version = "1.0.*", features = ["derive"] }
serde-aux = "4.7.*"
serde_json = "1.0.*"
serde_qs = "1.1.*"
tera = "1.20.*"
thiserror = "2.0.*"
tokio = { version = "1.44.*", features = ["macros", "rt-multi-thread"] }
tosurnament-config = { path = "../../libs/config" }
tosurnament-core = { path = "../../libs/core" }
tosurnament-telemetry = { path = "../../libs/telemetry" }
tower = "0.5.*"
tower-http = { version = "0.6.*", features = ["fs", "trace"] }
tracing = { version = "0.1.*", features = ["log"] }

[dev-dependencies]
serial_test = "3.5.*"
tl = "0.7.*"
tokio-tungstenite = "0.29.*"
tosurnament-api = {
  path = "../api",
  default-features = false,
  features = [
    "test-utils",
  ]
}
uuid = "1.23.*"
