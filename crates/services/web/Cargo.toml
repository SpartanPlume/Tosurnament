[package]
name = "tosurnament-web"
version = "0.1.0"
authors = ["Spartan Plume <spartan.plume@gmail.com>"]
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "tosurnament-web"

[dependencies]
anyhow = "1.0.*"
axum = { version = "0.8.*", features = ["macros", "ws"] }
chrono = { version = "0.4.*", default-features = false, features = [
    "clock",
    "serde",
] }
educe = { version = "0.6.*", default-features = false, features = [
    "PartialEq",
    "Eq",
] }
futures = "0.3.*"
indexmap = "2.9.*"
irc = { version = "1.1.*", default-features = false, features = [
    "ctcp",
    "tls-native",
    "channel-lists",
] }
once_cell = "1.21.*"
regex = "1.11.*"
reqwest = { version = "0.12.*", features = ["json"] }
secrecy = "0.10.*"
serde = { version = "1.0.*", features = ["derive"] }
serde-aux = "4.6.*"
serde_json = "1.0.*"
serde_qs = "0.14.*"
tera = "1.20.*"
thiserror = "2.0.*"
tokio = { version = "1.44.*", features = ["macros", "rt-multi-thread"] }
tower = "0.5.*"
tower-http = { version = "0.6.*", features = ["fs", "trace"] }
tracing = { version = "0.1.*", features = ["log"] }
tosurnament-core = { path = "../../libs/core" }
tosurnament-config = { path = "../../libs/config" }
tosurnament-telemetry = { path = "../../libs/telemetry" }

[dev-dependencies]
replace_with = "0.1.*"
serial_test = "3.2.*"
tl = "0.7.*"
tokio-tungstenite = "0.26.*"
tosurnament-api = { path = "../api", default-features = false, features = [
    "test-utils",
] }
uuid = "1.16.*"
