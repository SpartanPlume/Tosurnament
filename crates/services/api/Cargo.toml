[package]
name = "tosurnament-api"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tosurnament-api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.*"
axum = { version = "0.8.*", features = ["macros"] }
chrono = {
  version = "0.4.*",
  default-features = false,
  features = [
    "clock",
    "serde",
  ]
}
lazy_static = "1.5.*"
ormlite = "0.24.*"
reqwest = { version = "0.13.*", features = ["form", "json"], optional = true }
serde = { version = "1.0.*", features = ["derive"] }
serde-aux = "4.7.*"
serde_json = "1.0.*"
sqlx = {
  version = "0.8.*",
  features = [
    "postgres",
    "runtime-tokio",
  ],
  optional = true
}
tera = "1.20.*"
thiserror = "2.0.*"
tokio = { version = "1.44.*", features = ["macros", "rt-multi-thread"] }
tosurnament-config = { path = "../../libs/config" }
tosurnament-core = { path = "../../libs/core" }
tosurnament-telemetry = { path = "../../libs/telemetry" }
tower = "0.5.*"
tower-http = { version = "0.6.*", features = ["fs", "trace"] }
tracing = { version = "0.1.*", features = ["log"] }
uuid = { version = "1.23.*", features = ["v4"], optional = true }

[dev-dependencies]
once_cell = "1.21.*"
tosurnament-api = { path = ".", features = ["test-utils"] }
tosurnament-core = { path = "../../libs/core", features = ["test-utils"] }

[features]
test-utils = ["reqwest", "sqlx", "uuid"]
