services:
  db:
    restart: always
    ports:
      - ${DB_PORT}:5432
  api:
    restart: always
    ports:
      - ${API_PORT}:8080
    environment:
      - APP_ENVIRONMENT=production
  web:
    restart: always
    ports:
      - ${WEB_PORT}:8080
    environment:
      - APP_ENVIRONMENT=production
